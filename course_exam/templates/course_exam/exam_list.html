{% extends 'main/base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-start mb-4">

    <div>

        <h1 class="fw-bold display-6 text-dark mb-2">
            <i class="fas fa-file-alt text-primary me-2"></i>
            Exams
        </h1>

    </div>

    {% if is_institute_user or is_instructor_user %}
    <a href="{% url 'create_exam' %}" class="btn btn-primary px-4 py-2 rounded-pill mt-4">
        <i class="fas fa-plus me-2"></i>
        Create Exam
    </a>
    {% endif %}

</div>

<hr>

<div class="row g-4">

    {% for exam in exams %}

    <div class="col-md-6">

        <div class="card shadow-sm border-0 h-100">

            <div class="card-body d-flex flex-column justify-content-between">

                <div>

                    <span class="text-uppercase text-muted small fw-semibold d-block mb-2">
                        {{ exam.course }}
                    </span>

                    <h5 class="card-title fw-bold text-dark mb-3">
                        {{ exam.title }}
                    </h5>

                </div>

                <div class="d-grid mt-3">

                    <a href="{% url 'exam_detail' exam.id %}"
                       class="btn btn-primary rounded-pill">

                        <i class="fas fa-eye me-2"></i>
                        View Exam Details

                    </a>

                </div>

            </div>

        </div>

    </div>

    {% empty %}

    <div class="col-12">
        <div class="alert alert-info">
            No exams found.
        </div>
    </div>

    {% endfor %}

</div>

{% endblock %}
