{% extends 'main/base.html' %}

{% block content %}

<div class="container py-5">

    <div class="d-flex justify-content-between">

        <h3>Exams</h3>

        <a href="{% url 'create_exam' %}" class="btn btn-primary">

            Create Exam

        </a>

        <!-- Removed invalid Start Examination link that referenced an undefined `item` -->

    </div>

    <hr>

    {% for exam in exams %}

    <div class="card mb-3">

        <div class="card-body">

            <h5>{{ exam.title }}</h5>

            <p>
                {{ exam.course }}
            </p>

            <a href="{% url 'exam_detail' exam.id %}" class="btn btn-outline-primary">

                View
            </a>

        </div>

    </div>

    {% empty %}

    <p>No exams found.</p>

    {% endfor %}

</div>

{% endblock %}
