<nav>
    <a href="{% url 'dashboard' %}"
        class="sidebar-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
        <i class="fas fa-columns me-3"></i> Dashboard
    </a>
    <a href="{% url 'my_courses' %}"
        class="sidebar-link {% if request.resolver_match.url_name == 'my_courses' %}active{% endif %}">
        <i class="fas fa-book me-3"></i> My Courses
    </a>
    <a href="{% url 'course_list' %}"
        class="sidebar-link {% if request.resolver_match.url_name == 'course_list' %}active{% endif %}">
        <i class="fas fa-search me-3"></i> Browse Courses
    </a>
    <a href="{% url 'student_exam_list' %}"
        class="sidebar-link {% if request.resolver_match.url_name == 'student_exam_list' %}active{% endif %}">
        <i class="fas fa-file-alt me-3"></i>Exam List
    </a>
    <a href="{% url 'my_registered_exams' %}"
        class="sidebar-link {% if request.resolver_match.url_name == 'my_registered_exams' %}active{% endif %}">
        <i class="fas fa-clipboard-list me-2"></i>
        My Exams
    </a>

    <a href="{% url 'bookmarked_courses' %}"
       class="sidebar-link {% if request.resolver_match.url_name == 'bookmarked_courses' %}active{% endif %}">
        <i class="fas fa-bookmark me-2"></i>
        Bookmarked
    </a>
    

    {% if exam %}

    <a href="{% url 'exam_results' exam.id %}" class="btn btn-success">

        View Results

    </a>

    {% endif %}

    <hr>
    <form action="{% url 'logout' %}" method="POST">
        {% csrf_token %}
        <button type="submit" class="sidebar-link text-danger border-0 bg-transparent w-100">
            <i class="fas fa-sign-out-alt me-3"></i> Logout
        </button>
    </form>
</nav>
