{% extends 'main/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center">
            
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-5">
                    
                    <div class="text-danger mb-4">
                        <i class="bi bi-person-x-fill" style="font-size: 3rem;"></i>
                    </div>
                    
                    <h3 class="fw-bold text-dark mb-3">Delete Instructor?</h3>
                    
                    <p class="text-secondary mb-4">
                        Are you sure you want to remove <strong class="text-dark">{{ instructor.name }}</strong>?<br>
                        This action cannot be undone.
                    </p>
                    
                    <form method="POST" class="d-flex justify-content-center gap-3">
                        {% csrf_token %}
                        
                        <a href="{% url 'courses:list' %}" class="btn btn-light px-4 py-2 fw-semibold text-secondary">
                            Cancel
                        </a>
                        
                        <button type="submit" class="btn btn-danger px-4 py-2 fw-semibold">
                            Yes, Delete
                        </button>
                    </form>
                    
                </div>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
